<html>
  <head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,user-scalable=no,maximum-scale=1">
	<title>Story Worlds - Cabin Scene</title>

    <!-- A‑Frame Core -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- Extras: nav-mesh + teleport -->
   <script src="javascript/aframe-extras.min.js"></script>

    <!-- Environment component -->

   <script src="javascript/aframe-environment-component.min.js"></script>

<script>
  function isIOS() {
    const ua = navigator.userAgent;
    const iOS = /iPhone|iPad|iPod/.test(ua);
    const iPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return iOS || iPadOS;
  }
</script>

 <script>
  // Create and preload audio
  const audio = new Audio();
  audio.src = "https://sof-webxr-assets.s3.us-east-2.amazonaws.com/new_woods_mixdown.mp3";
  audio.crossOrigin = "anonymous";
  audio.loop = true;
  audio.load();

  const startButton = document.getElementById('startAudioButton');

  // Try autoplay immediately (works on Edge/Chrome/Android)
  audio.play().catch(() => {
    // If autoplay fails AND we're on iOS → show the VR button
    if (isIOS()) {
      startButton.setAttribute('visible', true);
    }
  });

  // VR button click → guaranteed gesture for iOS
  startButton.addEventListener('click', () => {
    audio.play().then(() => {
      startButton.setAttribute('visible', false);
    });
  });

  // Optional hover highlight
  startButton.addEventListener('mouseenter', () => {
    startButton.setAttribute('material', 'color: #555; opacity: 0.95');
  });

  startButton.addEventListener('mouseleave', () => {
    startButton.setAttribute('material', 'color: #333; opacity: 0.85');
  });
</script>

 
  </head>

  <body>

<a-scene overlay-visibility="" class="fullscreen" inspector="url:https://cdn.jsdelivr.net/gh/aframevr/aframe-inspector@master/dist/aframe-inspector.min.js" keyboard-shortcuts="" screenshot="" vr-mode-ui="vr">

      <!-- ASSETS -->
      <a-assets timeout="20000">
        <img id="forest" src="images/HDR_forest.png">
	<a-asset-item id="navigation" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/NavMesh.glb" crossorigin="anonymous"></a-asset-item> 
	<a-asset-item id="cabin" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/CabinScene1.glb" crossorigin="anonymous"></a-asset-item>
	<audio id="ambientWoods" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/new_woods_mixdown.mp3" crossorigin="anonymous" preload="auto"></audio>
      </a-assets>

      <!-- PLAYER -->
      <a-entity id="rig" movement-controls="constrainToNavMesh: true; controls: checkpoint, gamepad, trackpad, keyboard, nipple;" position="10 0 6" rotation="0 40 0" checkpoint-controls gamepad-controls trackpad-controls keyboard-controls nipple-controls>
        <a-entity id="head"
                  camera
                  look-controls="pointerLockEnabled: true" 
		  position="1 1.6 -1"
		  rotation>
          <a-cursor material raycaster="objects: [data-raycastable]" cursor geometry position></a-cursor>
        </a-entity>
      </a-entity>

      <a-entity environment="active:false;" preset-switcher="" id="environment">
</a-entity>

<a-entity id="startAudioButton"
          geometry="primitive: plane; height: 0.35; width: 0.9"
          material="color: #333; opacity: 0.85"
          text="value: Start Audio; align: center; color: #FFF"
          position="0 1.6 -2"
          visible="false">
</a-entity>

      <!-- SCENE OBJECTS -->
      <!-- Background dome -->
      <a-sphere id="background"
                position="0 0 0"
                rotation="0 0 0"
                radius="15"
                src="#forest"
                material="side: back; shader: flat"
		metadata="unlit"
                shadow="receive: false; cast: false"
		visible>
      </a-sphere>

      <!-- Nav Mesh -->
      <a-entity nav-mesh 
	       id="nav"
               normal-material
               position="0 0.01 0"
	       gltf-model="#navigation"
   	       visible="false">
      </a-entity>

      <!-- Cabin environment model -->
      <a-entity gltf-model="#cabin" id="mainScene" position="0 0.01 0"></a-entity>


      <!-- LIGHTING -->
      <a-entity id="amb" light="type: ambient; intensity: 10" position="0 3 0" visible></a-entity>

    </a-scene>
</body>
</html>
