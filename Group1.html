<!DOCTYPE html>
<!-- Group 1: Summer, Constanza, Brian, gabrielle -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autumn Pumpkin Patch</title>

  <!-- A‑Frame Core -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Extras: nav-mesh + teleport -->

    <!-- Extras: nav-mesh + teleport -->
   <script src="javascript/aframe-extras.min.js"></script>

    <!-- Environment component -->

   <script src="javascript/aframe-environment-component.min.js"></script>



  <style>
    :root {
      --light-gray-bg: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff7e7;
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin: 16px 8px 4px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      color: #713d22;
    }

    p {
      font-family: Georgia, serif;
      background-color: var(--light-gray-bg);
      color: #222;
      max-width: 800px;
      margin: 16px auto;
      line-height: 1.6;
      padding: 12px 20px 24px;
    }

    #VR-scene {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 24px;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 3 / 2;
      display: flex;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 600px) {
      #VR-scene {
        border-width: 1px;
        margin-bottom: 16px;
      }
    }
  </style>
</head>

<body>

  <p>Welcome to the pumpkin patch! Follow the garden path past our friendly scarecrow to the farmhouse. Drag to look around and use W, A, S, D or the arrow keys to explore. On a compatible headset, enter VR for a closer look.</p>
